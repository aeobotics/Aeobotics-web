    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What services does AEOBOTICS offer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AEOBOTICS offers custom website development, SEO (Search Engine Optimization), GEO (Generative Engine Optimization), AEO (Answer Engine Optimization), AI chatbot development, WhatsApp automation, and AI infrastructure & business automation. Each service is designed to work together as an integrated growth system."
          }
        },
        {
          "@type": "Question",
          "name": "What is GEO and how is it different from SEO?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "GEO (Generative Engine Optimization) optimizes your content for AI-powered search engines like ChatGPT, Gemini, and Perplexity, while traditional SEO focuses on Google rankings. GEO ensures your brand is referenced in AI-generated responses — a critical channel as more users turn to AI assistants for recommendations and research."
          }
        },
        {
          "@type": "Question",
          "name": "How long does it take to build a custom website?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most custom websites are delivered within 4-8 weeks depending on complexity. We prioritize speed without compromising quality, using modern frameworks like Next.js and React. Our process includes discovery, design, development, testing, and launch phases with weekly progress updates."
          }
        },
        {
          "@type": "Question",
          "name": "What makes your AI chatbots different?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Our AI chatbots are custom-trained on your business data, brand voice, and specific use cases. They can qualify leads, answer complex questions, book meetings, process orders, and escalate to humans when needed. Unlike generic chatbots, ours learn and improve over time based on conversation analytics."
          }
        },
        {
          "@type": "Question",
          "name": "How do you measure success for SEO and GEO?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We track traditional SEO metrics (rankings, organic traffic, conversions) alongside new GEO metrics (AI mention frequency, citation accuracy, brand presence in AI responses). You receive a comprehensive dashboard showing both traditional and AI-search visibility metrics."
          }
        },
        {
          "@type": "Question",
          "name": "Can you integrate with our existing systems?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely. We specialize in integrating with CRMs (Salesforce, HubSpot), marketing platforms, e-commerce systems, and custom APIs. Our AI infrastructure work often involves connecting disparate systems into a unified, intelligent workflow."
          }
        },
        {
          "@type": "Question",
          "name": "What is your pricing model?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We offer project-based pricing for websites and retainers for ongoing services like SEO, GEO, and AI management. Every engagement starts with a free strategy call to understand your goals and provide a custom proposal."
          }
        },
        {
          "@type": "Question",
          "name": "Do you offer ongoing support after launch?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, all our engagements include a post-launch support period. We also offer monthly retainer packages for continuous optimization, content updates, performance monitoring, and strategy refinement."
          }
        }
      ]
    }
